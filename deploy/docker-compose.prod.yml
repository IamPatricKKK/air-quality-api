# Production stack — Chất Lượng Không Khí Việt Nam
#
# CI/CD model: GitHub Actions builds every image and pushes to GHCR
# (ghcr.io/iampatrickkk/air-quality-*). The VPS only PULLS pre-built images —
# it never builds. This keeps the 2GB VPS light and avoids needing npm/pip/
# Docker Hub access from the server (only GHCR, which is GitHub infra).
#
# Base images (postgres, caddy) are mirrored to GHCR too, so the VPS pulls
# EVERYTHING from one registry it can reach.
#
# Deploy on the server (only needs this file + .env + Caddyfile):
#   docker login ghcr.io -u IamPatricKKK            # paste a GitHub PAT (read:packages)
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#   docker compose -f docker-compose.prod.yml --env-file .env exec api yarn migration:up

services:
  postgres:
    image: ghcr.io/iampatrickkk/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  api:
    image: ghcr.io/iampatrickkk/air-quality-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3002"
    mem_limit: 512m

  be:
    image: ghcr.io/iampatrickkk/air-quality-be:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWKS_URL: http://api:3002/api/v1/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
      ANALYTICS_SUMMARY_CRON: ${ANALYTICS_SUMMARY_CRON:-0 1 * * *}
      ANALYTICS_ANOMALY_CRON: ${ANALYTICS_ANOMALY_CRON:-0 */6 * * *}
      ANALYTICS_FORECAST_CRON: ${ANALYTICS_FORECAST_CRON:-0 2 * * *}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    mem_limit: 900m

  fe:
    image: ghcr.io/iampatrickkk/air-quality-fe:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"

  admin:
    image: ghcr.io/iampatrickkk/air-quality-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: ghcr.io/iampatrickkk/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fe
      - admin
      - api
      - be

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

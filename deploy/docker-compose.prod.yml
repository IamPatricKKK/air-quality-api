# Production stack — Chất Lượng Không Khí Việt Nam
#
# Layout expected on the server (all 4 repos cloned side-by-side):
#   /opt/airquality/
#     ├── air-quality-api/   (this repo — contains deploy/)
#     ├── air-quality-be/
#     ├── air-quality-fe/
#     └── air-quality-admin/
#
# Run from inside air-quality-api/deploy/:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Build contexts are relative to THIS file (air-quality-api/deploy/).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port published — DB is reachable only inside the docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  api:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3002"
    mem_limit: 512m

  be:
    build:
      context: ../../air-quality-be
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWKS_URL: http://api:3002/api/v1/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
      ANALYTICS_SUMMARY_CRON: ${ANALYTICS_SUMMARY_CRON:-0 1 * * *}
      ANALYTICS_ANOMALY_CRON: ${ANALYTICS_ANOMALY_CRON:-0 */6 * * *}
      ANALYTICS_FORECAST_CRON: ${ANALYTICS_FORECAST_CRON:-0 2 * * *}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    # Prophet/ML is memory-hungry; cap it so it can't OOM-kill Postgres/API.
    mem_limit: 900m

  fe:
    build:
      context: ../../air-quality-fe
      args:
        VITE_AIR_QUALITY_API_URL: https://api.${DOMAIN}/api/v1
        VITE_AIR_QUALITY_BE_URL: https://be.${DOMAIN}/api/v1
        VITE_AIR_QUALITY_ADMIN_URL: https://admin.${DOMAIN}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    restart: unless-stopped
    expose:
      - "80"

  admin:
    build:
      context: ../../air-quality-admin
      args:
        VITE_AIR_QUALITY_API_URL: https://api.${DOMAIN}/api/v1
        VITE_AIR_QUALITY_BE_URL: https://be.${DOMAIN}/api/v1
        VITE_AIR_QUALITY_FE_URL: https://${DOMAIN}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fe
      - admin
      - api
      - be

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

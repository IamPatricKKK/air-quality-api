name: DB Migrate (Staging)

# Chạy migration trên DB stage (sky_pulse_stage). SSH vào VPS và chạy
# `migration:up` bên trong container api stage.

on:
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/airquality/api-stage
  SSH_OPTS: -o StrictHostKeyChecking=no -o ConnectTimeout=15

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Chỉ chủ repo mới được kích hoạt
    if: github.actor == 'IamPatricKKK'
    environment: staging
    concurrency:
      group: db-migrate-staging
      cancel-in-progress: false
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Run migrations inside api-stage container
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && docker compose exec -T api yarn migration:up"
